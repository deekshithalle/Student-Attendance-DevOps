apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-attendance-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-attendance
  template:
    metadata:
      labels:
        app: student-attendance
    spec:
      containers:
        - name: student-attendance
          image: student-attendance-app:jenkins
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: student-attendance-service
spec:
  type: NodePort
  selector:
    app: student-attendance
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30081